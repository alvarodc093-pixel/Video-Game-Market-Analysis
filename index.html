<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Game Market Analysis</title>
  <meta name="description" content="Dashboard del mercado de videojuegos (VGChartz 2024) hecho con Streamlit y ejecutado en el navegador con stlite.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #carga { padding: 48px 24px; text-align: center; color: #444; }
  </style>
</head>
<body>
  <div id="root"><p id="carga">Cargando el dashboard en tu navegador (la primera vez tarda unos 20-30 segundos)…</p></div>
  <script type="module">
    // La app de Streamlit se ejecuta entera en el navegador con stlite (Pyodide):
    // no hay servidor que se duerma. App.py y el CSV se sirven desde este mismo repo.
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.js";
    mount(
      {
        requirements: ["pandas", "matplotlib", "seaborn"],
        entrypoint: "App.py",
        files: {
          "App.py": { url: "App.py" },
          "Data/vgchartz-2024.csv": { url: "Data/vgchartz-2024.csv" },
          ".streamlit/config.toml": { data: "[client]\ntoolbarMode = \"viewer\"\n" },
        },
      },
      document.getElementById("root"),
    );
  </script>
</body>
</html>
